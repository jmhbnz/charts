apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-wordpress
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1

  selector:
    matchLabels:
      app: wordpress

  template:
    metadata:
      labels:
        app: wordpress

    spec:
      containers:
        - name: wordpress
          image: {{ .Values.image.repository }}:{{ .Chart.AppVersion }}

          ports:
            - containerPort: 80

          env:
            - name: WORDPRESS_DB_HOST
              value: {{ .Release.Name }}-mariadb

            - name: WORDPRESS_DB_NAME
              value: wordpress

            - name: WORDPRESS_DB_USER
              value: wordpress

            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mariadb
                  key: password

          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-wordpress-data
