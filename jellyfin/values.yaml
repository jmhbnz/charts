---
replicaCount: 1

image:
  repository: ghcr.io/jellyfin/jellyfin
  tag: 12.0-rc3
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8096

ingress:
  enabled: false

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  media:
    enabled: false
    accessMode: ReadWriteOnce
    size: 10Gi
  extraExistingClaimMounts: []

resources:
  limits:
    memory: 12Gi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

extraVolumes:
  - name: jammaraid
    hostPath:
      path: /media/raid/jammaraid

extraVolumeMounts:
  - mountPath: /media/raid/jammaraid
    name: jammaraid
